<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Space Grotesk', Arial, sans-serif">
  <defs>
    <radialGradient id="gTeal" cx="86%" cy="2%" r="70%">
      <stop offset="0%" stop-color="#34c98a" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#34c98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gRad" cx="6%" cy="102%" r="65%">
      <stop offset="0%" stop-color="#dba43a" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#dba43a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <rect width="1200" height="630" fill="#0A0B0D"/>
  <rect width="1200" height="630" fill="url(#gTeal)"/>
  <rect width="1200" height="630" fill="url(#gRad)"/>
  <rect x="18" y="18" width="1164" height="594" rx="18" fill="none" stroke="#20262F" stroke-width="1.5"/>

  <!-- wordmark -->
  <circle cx="90" cy="92" r="9" fill="#34c98a"/>
  <text x="110" y="103" font-size="40" font-weight="800" fill="#F4F6F8" letter-spacing="-0.5">Daikonbun</text>
  <text x="1118" y="99" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="3.5" fill="#34c98a">SELF-HOSTED · MCP-NATIVE · BETA</text>

  <!-- headline -->
  <text x="78" y="290" font-size="82" font-weight="800" fill="#F4F6F8" letter-spacing="-2.5">Where your AI agents</text>
  <text x="78" y="382" font-size="82" font-weight="800" fill="#F4F6F8" letter-spacing="-2.5">work <tspan fill="#34c98a">under review.</tspan></text>
  <rect x="288" y="396" width="560" height="9" rx="4.5" fill="#dba43a" transform="rotate(-1 568 400)"/>

  <!-- sub-lede -->
  <text x="80" y="468" font-size="29" font-weight="600" fill="#C6CDD4" letter-spacing="-0.3">Your agent drives the board over MCP. Every task is</text>
  <text x="80" y="508" font-size="29" font-weight="600" fill="#C6CDD4" letter-spacing="-0.3">reviewed and recorded before it merges — not raw agent PRs.</text>

  <!-- pipeline motif -->
  <text x="80" y="555" font-family="'IBM Plex Mono', monospace" font-size="18" fill="#6B747E" letter-spacing="1">intake › plan › review › build › test › done</text>

  <!-- footer row -->
  <text x="80" y="592" font-family="'IBM Plex Mono', monospace" font-size="22" fill="#34c98a">daikonbun.com</text>
  <text x="1118" y="591" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="18" fill="#9AA4AE">reviewed · recorded · self-hosted</text>
</svg>
